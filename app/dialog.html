<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 10px;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .dialog-box {
            width: 280px;
            padding: 12px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #000;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0px 3px 3px 1px rgba(0, 0, 0, 0.3), 0px 2px 5px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .dialog-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #ff4d4f;
        }

        .dialog-message {
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.4;
            max-width: 260px;
        }

        .dialog-button {
            padding: 8px 14px;
            background: linear-gradient(135deg, #ff4d4f, #e60026);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out, background 0.3s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            -webkit-app-region: no-drag;
            box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.5);
        }

        .dialog-button:hover {
            background: linear-gradient(135deg, #e60026, #ff1a1a);
            transform: scale(1.02);
        }

        .dialog-button:focus {
            outline: none;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: white;
        }
    </style>
</head>

<body>
    <div class="dialog-box">
        <div class="dialog-title">
            <svg class="icon" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15a1.5 1.5 1 110-3 1.5 1.5 1 010 3zm1-5.5h-2V7h2v4.5z"
                    fill="currentColor" />
            </svg>
            出问题啦 ~
        </div>
        <div class="dialog-message">
            工具可能被杀毒软件误报查杀了 !<br>
            推荐你到工具箱搜索 <strong>ChekTools</strong><br>
            运行它来检查工具的完整性 💖<br>
        </div>
        <button class="dialog-button" onclick="window.close()">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M21 6L9 18l-5-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            明白啦
        </button>
    </div>
</body>

</html>
