<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8" />
  <title>Frida IDE</title>
  <script src="../JS/AceMain/ace.js"></script>
  <script src="../JS/AceMain/ext-language_tools.js"></script>
  <script src="../JS/AceMain/beautify.min.js"></script>
  <link rel="stylesheet" href="../Fonts/FontAwesome/css/font-awesome.min.css" />
  <link rel="stylesheet" type="text/css" href="../CSS/FridaMain.css">
</head>

<body>
  <div class="Frida-IDE-view">
    <div class="Frida-IDE-header">
      <img class="Frida-IDE-logo" src="../Assets/Image/Logo.png" draggable="false">
      <p class="Frida-IDE-title">Frida IDE</p>
      <div class="Frida-IDE-topview">
        <button class="Frida-IDE-android"><img src="../Assets/Image/Android.png"></button>
        <button class="Frida-IDE-search"><img src="../Assets/Image/Search.png"></button>
        <input type="text" class="Frida-IDE-PID" value="0">
        <label class="Frida-IDE-switch">
          <input type="checkbox" id="Frida-IDE-toggleButton">
          <span class="Frida-IDE-slider"></span>
        </label>
        <button class="Frida-IDE-topButton fa fa-window-minimize" id="minimize-btn"></button>
        <button class="Frida-IDE-topButton maximize-btn" id="maximizeButton">⛶</button>
        <button class="Frida-IDE-topButton fa fa-times" id="closeButton"></button>
      </div>
    </div>

    <div id="editor"></div>

  </div>

  <img src="../Assets/Image/GL.png" class="Frida-IDE-overlay-image">
  <div id="Frida-IDE-dropZone" style="visibility: hidden;">
    <div id="Frida-IDE-dropArea"><img src="../Assets/Image/Box.png"></div>
  </div>

  <div id="Frida-IDE-ProcessWindow" class="Frida-IDE-draggable">
    <div class="Frida-IDE-window-header">
      <button class="Frida-IDE-window-closebtn fa fa-times"></button>
    </div>

    <div class="Frida-IDE-tabs">
      <div class="Frida-IDE-tab active" data-tab="windows">Windows</div>
      <div class="Frida-IDE-tab" data-tab="android">Android</div>
    </div>

    <div class="Frida-IDE-search-container">
      <input type="text" id="Frida-IDE-processSearch" placeholder=" 请输入进程名 | 包名 " spellcheck="false" maxlength="40">
    </div>

    <div class="Frida-IDE-tabcontent active" id="tab-windows">
      <div class="Frida-IDE-table-container">
        <table>
          <tbody id="Frida-IDE-processes"></tbody>
        </table>
      </div>
    </div>

    <div class="Frida-IDE-tabcontent" id="tab-android">
      <div class="Frida-IDE-table-container">
        <table>
          <tbody id="Frida-IDE-processes-android"></tbody>
        </table>
      </div>
    </div>

    <div id="Frida-IDE-modeSelector">
      <select id="Frida-IDE-modeSelect">
        <option value="Attach">附加 [ Attach ]</option>
        <option value="Spawn">启动 [ Spawn ]</option>
      </select>
    </div>

    <script src="../JS/FridaEditor.js"></script>
    <script src="../JS/FridaFunc.js"></script>
</body>

</html>
