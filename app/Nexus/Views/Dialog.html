<!DOCTYPE html>
<html lang="zh">

<!--

  @LastUpdated 2026-04-01
  @Description 次元剑工具异常提示面板
  @License     MIT
-->

<head>
    <meta charset="UTF-8" />
    <title>工具异常提示</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-app-region: drag;
        }

        .dialog {
            background: rgba(0, 0, 0, 0.98);
            border-radius: 16px;
            border: 2px solid rgb(1 150 100);
            width: 290px;
            padding: 28px 28px 24px;
            color: #eee;
            text-align: center;
            animation: fadeInScale 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0px 2px rgba(0, 0, 0, 0.6), 0 0 10px rgba(1, 150, 100, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .icon-wrap {
            background: linear-gradient(135deg, rgb(1 150 100), rgb(1 150 100));
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrap svg {
            width: 32px;
            height: 32px;
            fill: #fff;
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .dialog-message {
            font-size: 14px;
            color: #b8b8b8;
            margin-bottom: 18px;
        }

        .dialog-message strong {
            color: rgb(1 150 100);
            font-weight: 600;
            background: rgba(1, 150, 100, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .dialog-button {
            -webkit-app-region: no-drag;
            width: 100%;
            padding: 11px 0;
            background: linear-gradient(135deg, rgb(1 150 100), rgb(1 150 100));
            color: #fff;
            border: none;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .dialog-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .dialog-button:hover {
            background: linear-gradient(135deg, rgb(1 150 100), rgb(1 150 100));
            transform: translateY(-2px);
        }

        .dialog-button:hover::before {
            left: 100%;
        }

        .dialog-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(1, 150, 100, 0.3);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="dialog">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
            </svg>
        </div>
        <div class="dialog-title">工具未找到</div>
        <div class="dialog-message">
            该工具可能被杀毒软件误报查杀<br />
            请在工具箱使用<strong>CheckTools</strong><br />
            来检查工具箱完整性。
        </div>
        <button class="dialog-button" onclick="window.close()">明白</button>
    </div>
</body>

</html>
