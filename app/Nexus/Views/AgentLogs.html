<!DOCTYPE html>
<html lang="zh-CN">

<!--

  @License     MIT
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Panel</title>
  <style>
    @font-face {
      font-family: 'BalooDa2';
      src: url('../Fonts/FontAwesome/SemiBold.ttf');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ms-bg-root: #0c0c0c;
      --ms-bg-surface: #141414;
      --ms-bg-elevated: #1a1a1a;
      --ms-text-primary: #f4f4f5;
      --ms-text-secondary: #a1a1aa;
      --ms-text-muted: #71717a;
      --ms-accent: #30c816;
      --ms-accent-soft: rgba(48, 200, 22, 0.12);
      --ms-bubble-border: rgba(255, 255, 255, 0.08);
      --ms-radius-sm: 6px;
      --ms-radius-md: 10px;
      --ms-font-display: 'BalooDa2', system-ui, sans-serif;
      --ms-font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --ms-font-mono: 'Consolas', 'JetBrains Mono', 'Fira Code', 'Microsoft YaHei', monospace;
    }

    body {
      font-family: var(--ms-font-body);
      background: transparent;
      color: var(--ms-text-primary);
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 12px;
      -webkit-app-region: no-drag;
      -webkit-font-smoothing: antialiased;
    }

    #panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-radius: 12px;
      overflow: hidden;
      background: var(--ms-bg-root);
      box-shadow: 0px 0px 3px 0px rgb(0 0 0 / 70%);
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #panel.closing {
      opacity: 0;
      transform: translateX(-20px);
    }

    #panel.opening {
      opacity: 0;
      transform: translateX(-20px);
    }

    .panel-header {
      position: relative;
      width: 100%;
      height: 30px;
      background: var(--ms-bg-surface);
      border-bottom: 1px solid var(--ms-bubble-border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .panel-header span {
      font-family: var(--ms-font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--ms-accent);
    }

    .panel-header .toggle-all-btn {
      margin-left: auto;
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ms-text-secondary);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--ms-font-body);
      transition: all 0.15s ease;
    }

    .panel-header .toggle-all-btn:hover {
      color: var(--ms-accent);
      border-color: var(--ms-accent);
    }

    .panel-header .export-btn {
      margin-left: 6px;
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ms-text-secondary);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--ms-font-body);
      transition: all 0.15s ease;
    }

    .panel-header .export-btn:hover {
      color: var(--ms-accent);
      border-color: var(--ms-accent);
    }

    #tool-log {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .empty-hint {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--ms-text-muted);
      font-family: var(--ms-font-display);
    }

    .tool-log-item {
      background: var(--ms-bg-surface);
      border: 1px solid var(--ms-bubble-border);
      border-radius: var(--ms-radius-md);
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      animation: logIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes logIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .tool-log-item .log-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
    }

    .tool-log-item .log-header:hover .log-name {
      color: #40d826;
    }

    .tool-log-item .log-icon {
      color: var(--ms-accent);
      font-family: var(--ms-font-mono);
      font-size: 11px;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .tool-log-item.collapsed .log-icon {
      transform: rotate(90deg);
    }

    .tool-log-item .log-body {
      overflow: hidden;
      max-height: 600px;
      transition: max-height 0.3s ease;
    }

    .tool-log-item.collapsed .log-body {
      max-height: 0;
    }

    .tool-log-item .log-name {
      color: var(--ms-accent);
      font-weight: 600;
      font-family: var(--ms-font-mono);
      font-size: 12px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-log-item .log-status {
      margin-left: auto;
      font-size: 10px;
      color: var(--ms-text-muted);
    }

    .tool-log-item .log-input {
      color: var(--ms-text-secondary);
      word-break: break-all;
      overflow-wrap: break-word;
      max-height: 80px;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: var(--ms-font-mono);
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 8px;
      border-radius: var(--ms-radius-sm);
      white-space: pre-wrap;
    }

    .tool-log-item .log-result {
      font-size: 13px;
      color: var(--ms-text-secondary);
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--ms-radius-sm);
      font-family: var(--ms-font-mono);
      padding: 6px 8px;
    }

    .tool-log-item .log-result pre {
      font-family: inherit;
    }

    .tool-log-item .log-loading {
      color: var(--ms-accent);
      font-size: 11px;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }

    .tool-log-item .log-loading::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--ms-accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>

<body>
  <div id="panel" class="opening">
    <div class="panel-header">
      <span>Agent Logs</span>
      <button class="toggle-all-btn" id="toggle-all-btn" title="展开/折叠全部">展开</button>
      <button class="export-btn" id="export-btn" title="导出日志为 JSON">导出</button>
    </div>
    <div id="tool-log">
      <p class="empty-hint">Agent Activity</p>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const toolLog = document.getElementById('tool-log');
    const emptyHint = toolLog.querySelector('.empty-hint');
    const toggleAllBtn = document.getElementById('toggle-all-btn');

    let allExpanded = localStorage.getItem('agentlogs_expanded') === 'true';
    updateToggleButton();

    function updateToggleButton() {
      toggleAllBtn.textContent = allExpanded ? '折叠' : '展开';
    }

    toggleAllBtn.addEventListener('click', () => {
      allExpanded = !allExpanded;
      localStorage.setItem('agentlogs_expanded', allExpanded);
      updateToggleButton();
      toolLog.querySelectorAll('.tool-log-item').forEach(item => {
        if (allExpanded) {
          item.classList.remove('collapsed');
        } else {
          item.classList.add('collapsed');
        }
      });
    });

    const exportBtn = document.getElementById('export-btn');
    exportBtn.addEventListener('click', () => {
      const logs = [];
      toolLog.querySelectorAll('.tool-log-item').forEach(item => {
        const nameEl = item.querySelector('.log-name');
        const statusEl = item.querySelector('.log-status');
        const inputEl = item.querySelector('.log-input');
        const resultEl = item.querySelector('.log-result');
        const log = {
          tool_id: item.id.replace('tool-', ''),
          tool_name: nameEl ? nameEl.textContent : '',
          status: statusEl ? statusEl.textContent : '',
          tool_input: inputEl ? inputEl.textContent.trim() : '',
          result: resultEl ? resultEl.textContent.trim() : '',
        };
        logs.push(log);
      });
      ipcRenderer.invoke('export-agent-logs', logs).then((res) => {
        if (res && res.ok) {
          exportBtn.style.color = '#30c816';
          setTimeout(() => { exportBtn.style.color = ''; }, 1200);
        }
      }).catch(() => {});
    });

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.getElementById('panel').classList.remove('opening');
      });
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function highlightJson(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"((?:[^"\\]|\\.)*)"\s*:/g, '<span style="color:#30c816;">"$1"</span>:')
        .replace(/: (".*?")/g, ': <span style="color:#fbbf24;">$1</span>')
        .replace(/: (\d+\.?\d*)/g, ': <span style="color:#60a5fa;">$1</span>')
        .replace(/: (true|false|null)/g, ': <span style="color:#c084fc;">$1</span>');
    }

    ipcRenderer.on('tool-call', (event, data) => {
      if (emptyHint) emptyHint.style.display = 'none';
      const item = document.createElement('div');
      item.className = 'tool-log-item' + (allExpanded ? '' : ' collapsed');
      item.id = 'tool-' + data.tool_id;
      const inputStr = data.tool_input && Object.keys(data.tool_input).length
        ? JSON.stringify(data.tool_input, null, 2)
        : '';
      item.innerHTML = `
      <div class="log-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="log-icon">&gt;</span>
        <span class="log-name">${escapeHtml(data.tool_name)}</span>
        <span class="log-status">Running</span>
      </div>
      <div class="log-body">
        ${inputStr ? `<div class="log-input">${highlightJson(inputStr)}</div>` : ''}
        <div class="log-result" id="result-${data.tool_id}">
          <span class="log-loading">Executing</span>
        </div>
      </div>
    `;
      toolLog.appendChild(item);
      while (toolLog.children.length > 100) {
        toolLog.removeChild(toolLog.firstChild);
      }
      toolLog.scrollTop = toolLog.scrollHeight;
    });

    ipcRenderer.on('tool-result', (event, data) => {
      const item = document.getElementById('tool-' + data.tool_id);
      const resultEl = document.getElementById('result-' + data.tool_id);
 
      if (item) {
        const status = item.querySelector('.log-status');
        if (status) {
          status.textContent = 'done';
        }
      }
      const text = data.content || '';
      if (resultEl && text) {
        const isJson = text.trim().startsWith('{') || text.trim().startsWith('[');
        if (isJson) {
          let formatted = text;
          try {
            formatted = JSON.stringify(JSON.parse(text), null, 2);
          } catch (e1) {
            try {
              formatted = JSON.stringify(JSON.parse(text.replace(/\\/g, '\\\\')), null, 2);
            } catch (e2) { }
          }
          resultEl.innerHTML = `<pre style="margin:0;white-space:pre-wrap;">${highlightJson(formatted)}</pre>`;
        } else {
          resultEl.innerHTML = escapeHtml(text);
        }
      } else if (resultEl) {
        resultEl.innerHTML = '';
      }
    });

    ipcRenderer.on('perm-request', (event, data) => {
      const existing = document.getElementById('_permoverlay');
      if (existing) existing.remove();
      const denials = data.denials || [];
      const toolList = denials.map((d, i) => {
        const name = escapeHtml(d.tool_name);
        let inputStr = '';
        try { inputStr = JSON.stringify(JSON.parse(JSON.stringify(d.tool_input)), null, 2); } catch (_) { }
        const inputHtml = inputStr
          ? highlightJson(inputStr)
          : escapeHtml(JSON.stringify(d.tool_input));
        return '<div style="margin-bottom:10px;"><span class="_permtoggle" data-idx="' + i + '" style="color:#30c816;font-weight:600;font-family:Consolas,monospace;font-size:12px;cursor:pointer;user-select:none;">▶ ' + name + '</span><pre class="_permjson" data-idx="' + i + '" style="display:none;background:rgba(0,0,0,0.3);border-radius:6px;padding:8px 10px;font-size:13px;color:#a1a1aa;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-all;margin:4px 0 0;line-height:1.5;font-family:system-ui,sans-serif;">' + inputHtml + '</pre></div>';
      }).join('');
      const panel = document.getElementById('panel');
      const overlay = document.createElement('div');
      overlay.id = '_permoverlay';
      overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:100000;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background 0.25s ease;border-radius:12px;';
      overlay.innerHTML = '<div style="background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:24px;width:400px;max-width:92%;box-shadow:0 16px 48px rgba(0,0,0,0.6);font-family:\'Segoe UI\',\'华文细黑\',sans-serif;opacity:0;transform:scale(0.92) translateY(16px);transition:opacity 0.25s ease,transform 0.25s cubic-bezier(0.34,1.56,0.64,1);"><h3 style="color:#f39c12;margin:0 0 12px;font-size:18px;">需要权限</h3><div style="max-height:220px;overflow-y:auto;margin:0 0 16px;">' + toolList + '</div><div style="display:flex;gap:10px;justify-content:flex-end;"><button id="_permdeny">拒绝</button><button id="_permallow">允许</button></div></div>';
      panel.appendChild(overlay);
      const card = overlay.querySelector('div');


      overlay.querySelectorAll('._permtoggle').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const idx = toggle.dataset.idx;
          const pre = overlay.querySelector('._permjson[data-idx="' + idx + '"]');
          if (pre.style.display === 'none') {
            pre.style.display = '';
            toggle.textContent = toggle.textContent.replace('▶', '▼');
          } else {
            pre.style.display = 'none';
            toggle.textContent = toggle.textContent.replace('▼', '▶');
          }
        });
      });

      const allowBtn = overlay.querySelector('#_permallow');
      const denyBtn = overlay.querySelector('#_permdeny');
      [allowBtn, denyBtn].forEach(btn => {
        btn.style.cssText = 'background:linear-gradient(145deg,#3a3a3a,#2a2a2a);border:1px solid #3f3f3f;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;font-family:inherit;transition:transform 0.2s ease,box-shadow 0.2s ease;';
        btn.addEventListener('mouseenter', () => { btn.style.transform = 'translateY(-2px)'; btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)'; });
        btn.addEventListener('mouseleave', () => { btn.style.transform = ''; btn.style.boxShadow = ''; });
        btn.addEventListener('mousedown', () => { btn.style.transform = 'translateY(1px) scale(0.97)'; btn.style.boxShadow = 'inset 0 2px 4px rgba(0,0,0,0.6)'; });
        btn.addEventListener('mouseup', () => { btn.style.transform = 'translateY(-2px)'; btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)'; });
      });

      allowBtn.style.background = 'linear-gradient(176deg,#f39c12,#de7110)';
      allowBtn.style.borderColor = '#de7110';

      const _requestId = data.requestId || null;
      const respond = (action) => {
        card.style.opacity = '0'; card.style.transform = 'scale(0.92) translateY(16px)';
        overlay.style.background = 'rgba(0,0,0,0)';
        setTimeout(() => overlay.remove(), 280);
        const payload = { action };
        if (_requestId) payload.requestId = _requestId;
        ipcRenderer.send('perm-response', payload);
      };
      allowBtn.onclick = () => respond('allow');
      denyBtn.onclick = () => respond('deny');
      overlay.onclick = (e) => { if (e.target === overlay) respond('deny'); };
      void overlay.offsetHeight;
      requestAnimationFrame(() => {
        overlay.style.background = 'rgba(0,0,0,0.6)';
        card.style.opacity = '1'; card.style.transform = 'scale(1) translateY(0)';
      });
    });

    ipcRenderer.on('question-request', (event, data) => {
      const existingQ = document.getElementById('_qoverlay');
      if (existingQ) existingQ.remove();
      const questions = data.questions || [];
      const panel = document.getElementById('panel');
      const overlay = document.createElement('div');
      overlay.id = '_qoverlay';
      overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:100000;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background 0.25s ease;border-radius:12px;';

      const bodyHtml = questions.map((q, qi) => {
        const qHeader = escapeHtml(q.header || '');
        const qText = escapeHtml(q.question || '');
        const multiHint = q.multi_select ? '（可多选）' : '';
        const opts = (q.options || []).map((o, oi) => {
          return '<div class="_qopt" data-q="' + qi + '" data-o="' + oi + '" style="margin:4px 0;padding:7px 10px;border:1px solid #3a3a3a;border-radius:6px;cursor:pointer;font-size:13px;color:#d4d4d8;transition:all 0.15s ease;user-select:none;">' + escapeHtml(o.label) + '<span style="display:block;font-size:11px;color:#8b8b92;margin-top:2px;">' + escapeHtml(o.description || '') + '</span></div>';
        }).join('');
        return '<div style="margin-bottom:14px;"><div style="color:#f39c12;font-weight:600;font-size:13px;margin-bottom:2px;">' + qHeader + ' ' + multiHint + '</div><div style="font-size:13px;color:#e4e4e7;margin-bottom:6px;">' + qText + '</div>' + opts + '</div>';
      }).join('');

      overlay.innerHTML = '<div style="background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:24px;width:460px;max-width:94%;max-height:80%;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.6);font-family:\'Segoe UI\',\'华文细黑\',sans-serif;opacity:0;transform:scale(0.92) translateY(16px);transition:opacity 0.25s ease,transform 0.25s cubic-bezier(0.34,1.56,0.64,1);"><h3 style="color:#30c816;margin:0 0 14px;font-size:18px;">夜璃想问你</h3>' + bodyHtml + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;"><button id="_qsubmit">提交</button></div></div>';
      panel.appendChild(overlay);
      const card = overlay.querySelector('div');

      const selection = {};
      overlay.querySelectorAll('._qopt').forEach(opt => {
        opt.addEventListener('click', () => {
          const qi = opt.dataset.q;
          const oi = opt.dataset.o;
          const q = questions[qi];
          const label = q.options[oi].label;
          if (q.multi_select) {
            const arr = selection[qi] || [];
            const pos = arr.indexOf(label);
            if (pos >= 0) { arr.splice(pos, 1); opt.style.borderColor = '#3a3a3a'; opt.style.background = ''; }
            else { arr.push(label); opt.style.borderColor = '#f39c12'; opt.style.background = 'rgba(243,156,18,0.12)'; }
            selection[qi] = arr;
          } else {
            overlay.querySelectorAll('._qopt[data-q="' + qi + '"]').forEach(o => { o.style.borderColor = '#3a3a3a'; o.style.background = ''; });
            opt.style.borderColor = '#30c816'; opt.style.background = 'rgba(48,200,22,0.14)';
            selection[qi] = [label];
          }
        });
      });

      const submitBtn = overlay.querySelector('#_qsubmit');
      submitBtn.style.cssText = 'background:linear-gradient(176deg,#30c816,#199b0a);border:1px solid #199b0a;color:#fff;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;font-family:inherit;transition:transform 0.2s ease,box-shadow 0.2s ease;';
      submitBtn.addEventListener('mouseenter', () => { submitBtn.style.transform = 'translateY(-2px)'; submitBtn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)'; });
      submitBtn.addEventListener('mouseleave', () => { submitBtn.style.transform = ''; submitBtn.style.boxShadow = ''; });

      const _requestId = data.requestId || null;
      submitBtn.onclick = () => {
        const answers = {};
        questions.forEach((q, qi) => {
          const arr = selection[qi] || [];
          answers[q.header] = arr.join(', ');
        });
        card.style.opacity = '0'; card.style.transform = 'scale(0.92) translateY(16px)';
        overlay.style.background = 'rgba(0,0,0,0)';
        setTimeout(() => overlay.remove(), 280);
        const payload = { answers };
        if (_requestId) payload.requestId = _requestId;
        ipcRenderer.send('question-response', payload);
      };

      void overlay.offsetHeight;
      requestAnimationFrame(() => {
        overlay.style.background = 'rgba(0,0,0,0.6)';
        card.style.opacity = '1'; card.style.transform = 'scale(1) translateY(0)';
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        toolLog.querySelectorAll('.tool-log-item').forEach(el => el.remove());
        if (emptyHint) emptyHint.style.display = '';
      }
    });

    ipcRenderer.on('close-agentlogs', () => {
      const panel = document.getElementById('panel');
      if (panel) {
        panel.classList.add('closing');
      }
    });

    ipcRenderer.on('window-restored', () => {
      const panel = document.getElementById('panel');
      if (panel) {
        panel.classList.remove('closing');
      }
    });

    ipcRenderer.on('clear-tool-log', () => {
      const items = toolLog.querySelectorAll('.tool-log-item');
      if (items.length === 0) {
        toolLog.querySelectorAll('.tool-log-item').forEach(el => el.remove());
        if (emptyHint) emptyHint.style.display = '';
        return;
      }
      items.forEach((el, i) => {
        el.style.transition = 'all 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px) scale(0.95)';
        el.style.marginBottom = '0';
        el.style.maxHeight = '0';
        el.style.overflow = 'hidden';
      });
      setTimeout(() => {
        items.forEach(el => el.remove());
        if (emptyHint) emptyHint.style.display = '';
      }, 260);
    });
  </script>
</body>

</html>
