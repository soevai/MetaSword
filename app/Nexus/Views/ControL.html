<!DOCTYPE html>
<html lang="zh">

<!--
  @Author      发光的神 (VoxShadow)
  @Version     1.0.7
  @Since       2023-08-31
  @LastUpdated 2026-01-07
  @Description 次元剑设置面板界面
  @License     MIT
-->

<head>
  <meta charset="UTF-8">
  <title>设置面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Fonts/FontAwesome/css/font-awesome.min.css" />
  <link rel="stylesheet" type="text/css" href="../CSS/ControLMain.css">
</head>

<body>
  <div class="button-panel">
    <div class="stitle">⌥</div>
    <div class="fa fa-times" id="close-btn"></div>
  </div>
  <div class="settings-container">

    <div class="settings-panel" id="settings-panel">
      <div class="setting-card">
        <h3>动画设置</h3>
        <label for="volume">动画速度 (默认：1.8)</label>

        <div class="media-container">
          <video class="media-item" autoplay muted loop preload="auto">
            <source src="../Assets/Videos/ControL.mp4" type="video/mp4">
          </video>
        </div>

        <input type="range" id="volume" name="volume" min="0.8" max="3" step="0.1" value="1.5">
        <div class="range-value" id="rangeValue">当前值：1.5</div>

        <label>启动动画 (默认：开启)</label>
        <button class="button" id="toggle-animation">关闭</button>
      </div>

      <div class="setting-card">
        <h3>AI 设置</h3>
        <label for="deepseek-Tips">DeepSeek API Key</label>
        <input type="password" id="deepseek-key" placeholder=" sk-xxxx... " class="input" maxlength="100"
          style="margin-top: 4px; ">

        <button class="button" id="save-deepseek-key" style="margin-top: 10px;">保存</button>
        <button class="button" id="clear-deepseek-key" style="margin-top: 6px; margin-left: 10px;">清除</button>
      </div>

      <div class="setting-card">
        <h3>版本更新</h3>
        <label for="theme">版本号 [ v1.0.7 ]</label>
        <button class="button" id="toggle-update">检查</button>
      </div>
      <!-- 防止半边 -->
      <p></p>

    </div>
  </div>

  <div class="popup" id="popup">
    <div class="popup-content">
      <p id="popup-message"></p>
      <button id="popup-ok"></button>
    </div>
  </div>

  <div id="toast"></div>

  <script>

    document.getElementById('save-deepseek-key')?.addEventListener('click', () => {
      const keyInput = document.getElementById('deepseek-key');
      if (!keyInput) return showToast("元素不存在", 'error');

      const key = keyInput.value.trim();
      if (key.length === 0) {
        showToast("不能为空");
        return;
      }

      localStorage.removeItem('DeepseekApiKey');
      localStorage.setItem('DeepseekApiKey', key);
      showToast("已保存", 'success');
    });

    document.getElementById('clear-deepseek-key')?.addEventListener('click', () => {
      localStorage.removeItem('DeepseekApiKey');
      const keyInput = document.getElementById('deepseek-key');
      if (keyInput) keyInput.value = '';
      showToast("已清空", 'error');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('DeepseekApiKey');
      const input = document.getElementById('deepseek-key');
      if (savedKey && input) {
        input.value = savedKey;
      }
    });

    let toastTimer = null;
    function showToast(message, type = 'default') {
      const toast = document.getElementById('toast');
      if (!toast) return;

      toast.textContent = message;

      const styleMap = {
        success: { bg: 'rgba(40, 167, 69, 0.95)', color: '#fff' },
        error: { bg: 'rgba(220, 53, 69, 0.95)', color: '#fff' },
        default: { bg: 'rgba(255, 255, 255, 0.95)', color: '#111' }
      };
      const style = styleMap[type];
      toast.style.backgroundColor = style.bg;
      toast.style.color = style.color;

      toast.style.transition = 'none';
      toast.style.right = '35px';
      toast.style.bottom = '25px';
      toast.style.transform = 'translateX(100%)';
      toast.offsetHeight;

      toast.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
      toast.style.transform = 'translateX(0%)';
      toast.style.opacity = '1';

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.transform = 'translateX(100%)';
        toast.style.opacity = '0';
      }, 1800);
    }

    try {
      const fs = require('fs');
      const path = require('path');
      const xml2js = require('xml2js');
      const { exec } = require('child_process');

      document.getElementById('toggle-update')?.addEventListener('click', async () => {
        try {
          const timestamp = new Date().getTime();
          const checkUrl = `https://meta.natapp4.cc/readme.txt?t=${timestamp}`;

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);

          const response = await fetch(checkUrl, {
            signal: controller.signal,
            cache: 'no-cache'
          });
          clearTimeout(timeoutId);
          if (!response.ok) throw new Error(`HTTP错误: ${response.status}`);

          const text = await response.text();
          const remote = text.match(/version:\s*v?([\d.]+)/i)?.[1];
          const localLabel = document.querySelector('label[for="theme"]');
          const local = localLabel?.innerText.match(/v?([\d.]+)/i)?.[1];

          if (!remote) throw new Error('未获取到远程版本号');
          if (!local) throw new Error('未获取到本地版本号');

          if (compareVersions(remote, local) > 0) {
            document.getElementById("popup-ok").innerText = "前往";
            showPopup(`有新版本: v${remote}`);
          } else {
            document.getElementById("popup-ok").innerText = "明白";
            showPopup('已最新版');
          }
        } catch (err) {
          const errMsg = err.name === 'AbortError' ? '检测超时' : '检测失败';
          showPopup(errMsg);
          console.error('版本检查错误:', err);
        }
      });

      function showPopup(message) {
        const popup = document.getElementById('popup');
        const popupMessage = document.getElementById('popup-message');
        if (!popup || !popupMessage) return;
        popupMessage.textContent = message;
        popup.style.display = 'flex';
      }

      document.getElementById('popup-ok')?.addEventListener('click', () => {
        const popup = document.getElementById('popup');
        const popupMessage = document.getElementById('popup-message');
        if (!popup || !popupMessage) return;

        const message = popupMessage.textContent;
        if (message.includes("有新版本")) {
          exec('start "" "https://meta.natapp4.cc/tools/sword/"', (err) => {
            if (err) console.error('打开链接失败:', err);
          });
        }
        popup.style.display = 'none';
      });

      function compareVersions(v1, v2) {
        const parts1 = v1.split('.').map(Number);
        const parts2 = v2.split('.').map(Number);
        const maxLen = Math.max(parts1.length, parts2.length);

        for (let i = 0; i < maxLen; i++) {
          const part1 = parts1[i] || 0;
          const part2 = parts2[i] || 0;
          if (part1 > part2) return 1;
          if (part1 < part2) return -1;
        }
        return 0;
      }

      const CONFIG_PATH = path.join(__dirname, '..', 'Views', 'config.xml');
      let configData = null;

      const loadConfig = async () => {
        try {
          if (!fs.existsSync(CONFIG_PATH)) {
            throw new Error(`配置文件不存在: ${CONFIG_PATH}`);
          }
          const data = await fs.promises.readFile(CONFIG_PATH, 'utf8');
          configData = await xml2js.parseStringPromise(data);

          const settings = configData.config?.settings?.[0];
          if (!settings || !settings.tag) throw new Error('配置格式错误');

          const animationStartTag = settings.tag.find(tag => tag.$.name === 'AnimationStart');
          const animationStart = animationStartTag?.$.value || 'enabled';
          const video = document.querySelector('.media-item');
          if (video) {
            animationStart === 'disabled' ? video.pause() : video.play();
          }

          const animationSpeedTag = settings.tag.find(tag => tag.$.name === 'AnimationSpeed');
          const animationSpeed = animationSpeedTag?.$.value || 1.8;
          const toggleBtn = document.getElementById('toggle-animation');
          const volumeInput = document.getElementById('volume');
          const rangeValue = document.getElementById('rangeValue');

          if (toggleBtn) toggleBtn.textContent = animationStart === 'enabled' ? '关闭' : '开启';
          if (video) video.playbackRate = animationSpeed;
          if (volumeInput) volumeInput.value = animationSpeed;
          if (rangeValue) rangeValue.textContent = `当前值：${animationSpeed}`;

        } catch (err) {
          console.error('加载配置失败:', err);
          showToast('配置加载失败', 'error');
        }
      };

      const saveConfig = async (name, value) => {
        try {
          if (!configData) throw new Error('配置未加载');
          const settings = configData.config?.settings?.[0];
          if (!settings || !settings.tag) throw new Error('配置格式错误');

          const tag = settings.tag.find(tag => tag.$.name === name);
          if (tag) {
            tag.$.value = value;
            const builder = new xml2js.Builder();
            const xmlData = builder.buildObject(configData);
            await fs.promises.writeFile(CONFIG_PATH, xmlData, 'utf8');
          } else {
            throw new Error(`未找到配置项: ${name}`);
          }
        } catch (err) {
          console.error('保存配置失败:', err);
          showToast('配置保存失败', 'error');
        }
      };

      const toggleAnimationStart = async (button) => {
        if (!button) return;
        const newStatus = button.textContent === '开启' ? 'enabled' : 'disabled';
        button.textContent = newStatus === 'enabled' ? '关闭' : '开启';

        const video = document.querySelector('.media-item');
        if (video) {
          if (newStatus === 'disabled') {
            video.currentTime = 5;
            video.pause();
          } else {
            video.play();
          }
        }

        await saveConfig('AnimationStart', newStatus);
      };

      document.getElementById('volume')?.addEventListener('input', (event) => {
        const input = event.target;
        const rangeValue = document.getElementById('rangeValue');
        updateRangeValue(input, rangeValue);
      });

      const updateRangeValue = async (input, rangeValue) => {
        if (!input || !rangeValue) return;
        const speed = input.value;
        rangeValue.textContent = `当前值：${speed}`;

        const video = document.querySelector('.media-item');
        if (video) video.playbackRate = speed;

        await saveConfig('AnimationSpeed', speed);
      };

      document.getElementById('toggle-animation')?.addEventListener('click', (event) => {
        toggleAnimationStart(event.target);
      });

      loadConfig();

    } catch (err) {
      console.error('模块加载失败', err);
      showToast('部分功能不可用', 'error');
    }

    document.getElementById('close-btn')?.addEventListener('click', () => {
      if (window.close) window.close();
    });

    document.addEventListener("DOMContentLoaded", function () {
      const settingsPanel = document.querySelector(".settings-panel");
      const settingCards = document.querySelectorAll(".setting-card");
      let isHoveringCard = false;


      settingsPanel?.addEventListener("wheel", function (event) {
        if (!isHoveringCard) {
          event.preventDefault();
          settingsPanel.scrollLeft += event.deltaY * 2;
        }
      }, { passive: false });

      settingCards.forEach(card => {
        card.addEventListener("mouseover", function () {
          isHoveringCard = true;
          card.classList.add("active");
        });

        card.addEventListener("mouseout", function (event) {
          if (!card.contains(event.relatedTarget)) {
            isHoveringCard = false;
            card.classList.remove("active");
          }
        });

        card.addEventListener("wheel", function (event) {
          event.stopPropagation();
        }, { passive: true });
      });
    });
  </script>
</body>

</html>
