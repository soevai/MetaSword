<head>
  <meta charset="UTF-8">
  <title>设置面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Fonts/FontAwesome/css/font-awesome.min.css" />
  <link rel="stylesheet" type="text/css" href="../CSS/ControLMain.css">
</head>

<body>
  <div class="button-panel">
    <div class="stitle">⌥</div>
    <div class="fa fa-times" id="close-btn"></div>
  </div>
  <div class="settings-container settings-panel-container">
    <div class="settings-panel" id="settings-panel">
      <div class="setting-card">
        <h3>动画设置</h3>
        <label for="volume">动画速度 (默认：1.8)</label>
        <div class="media-container">
          <video class="media-item" autoplay muted loop preload="auto">
            <source src="../Assets/Videos/ControL.mp4" type="video/mp4">
          </video>
        </div>
        <input type="range" id="volume" name="volume" min="0.8" max="3" step="0.1" value="1.8">
        <div class="range-value" id="rangeValue">当前值：1.8</div>
        <label>启动动画 (默认：开启)</label>
        <button class="button" id="toggle-animation">关闭</button>
        <hr style="margin: 15px 0; border: 1px solid #333;">
        <h3>主题设置</h3>
        <label>选择主题</label>
        <div class="theme-options" id="theme-options">

        </div>
        <div class="theme-preview">
          <div class="preview-box" id="theme-preview"></div>
        </div>
        <hr style="margin: 15px 0; border: 1px solid #333;">
        <h3>窗口设置</h3>
        <label>主窗口置顶 (默认：关闭)</label>
        <button class="button" id="toggle-topmost">开启</button>
      </div>
      <div class="setting-card">
        <h3>版本更新</h3>
        <label for="theme" id="version-label">当前版本</label>
        <button class="button" id="toggle-update">检查</button>
      </div>
      <div class="setting-card">
        <h3>关于软件</h3>
        <label>帮助与反馈</label>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
          <button class="button" id="website-btn"
            style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; width: auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            官网
          </button>
          <button class="button" id="feedback-btn"
            style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; width: auto; margin-left: 6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            反馈
          </button>
        </div>
        <div style="display: flex; gap: 5px;">
          <button class="button" id="github-btn"
            style="display: flex; align-items: center; justify-content: center; gap: 8px; width: auto;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.756-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.107.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
            </svg>
            开源
          </button>
          <button class="button" id="intelligence-btn"
            style="display: flex; align-items: center; justify-content: center; gap: 8px; width: auto; margin-left: 6px;">
            <i class="fa fa-shield"
              style="width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;"></i>
            情报
          </button>
        </div>
      </div>
      <p></p>
    </div>
    <div class="popup" id="popup">
      <div class="popup-content">
        <p id="popup-message"></p>
        <button id="popup-ok"></button>
      </div>
    </div>
    <div class="mcp-popup" id="mcp-popup">
      <div class="mcp-popup-content">
        <div id="mcp-popup-content">
          <div style="text-align: left; padding: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h4 style="color: #f39c12; margin: 0; font-size: 16px; font-family: emoji;">MCP 配置</h4>
              <button id="copy-btn" class="button"
                style="background: linear-gradient(176deg, #f39c12, #de7110); margin: 0; padding: 6px 12px; font-size: 12px;">复制</button>
            </div>
            <div id="mcp-config-content"
              style="background: #0c0c0c; border: 1px solid #333; border-radius: 6px; padding: 12px; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre; word-break: normal; margin-bottom: 10px; font-weight: bold; overflow-x: auto;">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="update-modal" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.82); backdrop-filter:blur(4px); z-index:10000; align-items:center; justify-content:center; opacity:0; transform:scale(0.92); transition:opacity 0.25s ease, transform 0.25s ease;">
      <div style="background:#1a1a1a; border:1px solid #333; border-radius:14px; padding:28px 32px; width:320px; box-shadow:0 8px 40px rgba(0,0,0,0.6);">
        <div style="color:#fff; font-size:15px; font-weight:bold; margin-bottom:18px;">正在更新中...</div>
        <div style="width:100%; height:12px; background:#2a2a2a; border-radius:6px; overflow:hidden;">
          <div id="update-modal-bar" style="width:0%; height:100%; background:linear-gradient(90deg,#ffb400,#ffa500); border-radius:6px; transition:width 0.4s ease;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const { exec } = require('child_process');
    const fs = require('fs');
    const path = require('path');
    const xml2js = require('xml2js');

    document.getElementById('mcp-btn')?.addEventListener('click', () => {
      let mcpPort = 2085;
      ipcRenderer.send('get-mcp-port');
      ipcRenderer.once('mcp-port', (event, port) => {
        mcpPort = port;
        showMCPPopup(mcpPort);
      });
    });

    function showMCPPopup(port) {
      const config = { mcpServers: { MetaSword: { type: 'http', url: `http://127.0.0.1:${port}/mcp` } } };
      const configText = JSON.stringify(config, null, 2);
      function highlightJSON(json) {
        try { JSON.parse(json); } catch (e) { return json; }
        return json
          .replace(/"([^"]+)"\s*:/g, '<span style="color: #f39c12;">"$1"</span>:')
          .replace(/:\s*"([^"]+)"/g, ': <span style="color: #27ae60;">"$1"</span>')
          .replace(/([{}\[\],])/g, '<span style="color: #95a5a6;">$1</span>');
      }
      const highlightedConfig = highlightJSON(configText);
      const mcpPopup = document.getElementById('mcp-popup');
      const mcpConfigContent = document.getElementById('mcp-config-content');
      if (mcpConfigContent) mcpConfigContent.innerHTML = highlightedConfig;
      mcpPopup.classList.add('show');
      const copyBtn = document.getElementById('copy-btn');
      if (copyBtn) {
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(configText);
            showToast('已复制', 'success');
            mcpPopup.classList.remove('show');
          } catch (err) {
            console.error('复制失败:', err);
            showToast('复制失败', 'error');
          }
        };
      }
    }

    document.getElementById('popup-ok')?.addEventListener('click', () => {
      const popup = document.getElementById('popup');
      if (window.mcpConfigText) {
        navigator.clipboard.writeText(window.mcpConfigText).then(() => showToast('已复制', 'success')).catch(err => {
          console.error('复制失败:', err);
          showToast('复制失败', 'error');
        });
        window.mcpConfigText = null;
      }
      popup.classList.remove('show');
    });

    let toastTimer = null;
    function showToast(message, type = 'default') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      const styleMap = {
        success: { bg: 'rgba(1, 150, 100, 0.95)', color: '#fff' },
        error:   { bg: 'rgba(220, 53, 69, 0.95)', color: '#fff' },
        warning: { bg: 'rgba(217, 130, 43, 0.95)', color: '#fff' },
        default: { bg: 'rgba(1, 150, 100, 0.9)',  color: '#fff' }
      };
      const style = styleMap[type] || styleMap.default;
      toast.style.backgroundColor = style.bg;
      toast.style.color = style.color;
      toast.style.transition = 'none';
      toast.style.top = '25px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%) translateY(-100%)';
      toast.offsetHeight;
      toast.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
      toast.style.transform = 'translateX(-50%) translateY(0%)';
      toast.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(-100%)';
        toast.style.opacity = '0';
      }, 1800);
    }

    try {
      const CONFIG_PATH = path.join(__dirname, '..', 'Views', 'config', 'Config.xml');
      let configData = null;
      const loadConfig = async (config) => {
        try {
          let animationStart, animationSpeed, alwaysOnTop;
          if (config) {
            animationStart = config.animationStart || 'enabled';
            animationSpeed = config.animationSpeed || 1.8;
            alwaysOnTop = config.alwaysOnTop || 'disabled';
          } else {
            if (!fs.existsSync(CONFIG_PATH)) throw new Error(`配置文件不存在: ${CONFIG_PATH}`);
            const data = await fs.promises.readFile(CONFIG_PATH, 'utf8');
            configData = await xml2js.parseStringPromise(data);
            const settings = configData.config?.settings?.[0];
            if (!settings || !settings.tag) throw new Error('配置格式错误');
            const animationStartTag = settings.tag.find(tag => tag.$.name === 'AnimationStart');
            const animationSpeedTag = settings.tag.find(tag => tag.$.name === 'AnimationSpeed');
            const alwaysOnTopTag = settings.tag.find(tag => tag.$.name === 'AlwaysOnTop');
            animationStart = animationStartTag?.$.value || 'enabled';
            animationSpeed = animationSpeedTag?.$.value || 1.8;
            alwaysOnTop = alwaysOnTopTag?.$.value || 'disabled';
          }
          const video = document.querySelector('.media-item');
          const toggleBtn = document.getElementById('toggle-animation');
          const volumeInput = document.getElementById('volume');
          const rangeValue = document.getElementById('rangeValue');
          const topmostBtn = document.getElementById('toggle-topmost');
          if (video) {
            animationStart === 'disabled' ? video.pause() : video.play().catch(() => {});
            video.playbackRate = animationSpeed;
          }
          if (toggleBtn) toggleBtn.textContent = animationStart === 'enabled' ? '关闭' : '开启';
          if (volumeInput) volumeInput.value = animationSpeed;
          if (rangeValue) rangeValue.textContent = `当前值：${animationSpeed}`;
          if (topmostBtn) topmostBtn.textContent = alwaysOnTop === 'enabled' ? '关闭' : '开启';
        } catch (err) {
          console.error('加载配置失败:', err);
          showToast('加载失败', 'error');
        }
      };
      const saveConfig = async (name, value) => {
        try {
          const result = await ipcRenderer.invoke('save-config', name, String(value));
        } catch (err) {
          console.error('保存配置失败:', err);
          showToast('保存失败', 'error');
        }
      };
      const toggleAnimationStart = async (button) => {
        if (!button) return;
        const newStatus = button.textContent === '开启' ? 'enabled' : 'disabled';
        button.textContent = newStatus === 'enabled' ? '关闭' : '开启';
        const video = document.querySelector('.media-item');
        if (video) {
          if (newStatus === 'disabled') {
            video.currentTime = 5;
            video.pause();
          } else {
            video.play();
          }
        }
        await saveConfig('AnimationStart', newStatus);
      };
      document.getElementById('volume')?.addEventListener('input', (event) => {
        const input = event.target;
        const rangeValue = document.getElementById('rangeValue');
        updateRangeValue(input, rangeValue);
      });
      const updateRangeValue = async (input, rangeValue) => {
        if (!input || !rangeValue) return;
        const speed = input.value;
        rangeValue.textContent = `当前值：${speed}`;
        const video = document.querySelector('.media-item');
        if (video) video.playbackRate = speed;
        await saveConfig('AnimationSpeed', speed);
      };
      document.getElementById('toggle-animation')?.addEventListener('click', (event) => toggleAnimationStart(event.target));
      const toggleTopmost = async (button) => {
        if (!button) return;
        const newStatus = button.textContent === '开启' ? 'enabled' : 'disabled';
        button.textContent = newStatus === 'enabled' ? '关闭' : '开启';
        ipcRenderer.send('set-main-always-on-top', newStatus === 'enabled');
        await saveConfig('AlwaysOnTop', newStatus);
      };
      document.getElementById('toggle-topmost')?.addEventListener('click', (event) => toggleTopmost(event.target));
      ipcRenderer.on('config-data', (event, config) => loadConfig(config));
      loadConfig();
    } catch (err) {
      console.error('模块加载失败', err);
      showToast('功能受限', 'error');
    }

    document.getElementById('close-btn')?.addEventListener('click', () => {
      if (window.close) window.close();
    });

    document.getElementById('intelligence-btn')?.addEventListener('click', () => {
      exec('start "" "https://www.52tt.pro/tools/osint/"', (err) => {
        if (err) console.error('打开情报链接失败:', err);
      });
    });

    document.getElementById('website-btn')?.addEventListener('click', () => {
      exec('start "" "https://www.52tt.pro/tools/sword/"', (err) => {
        if (err) console.error('打开官网链接失败:', err);
      });
    });

    document.getElementById('feedback-btn')?.addEventListener('click', () => {
      exec('start "" "https://www.52tt.pro/index.php/2132.html"', (err) => {
        if (err) console.error('打开社区链接失败:', err);
      });
    });

    document.getElementById('github-btn')?.addEventListener('click', () => {
      exec('start "" "https://github.com/soevai/MetaSword"', (err) => {
        if (err) console.error('打开GitHub链接失败:', err);
      });
    });

    let updateProgressHandler = null;
    const performUpdate = async () => {
      const updateButton = document.getElementById('toggle-update');
      const versionLabel = document.getElementById('version-label');
      const modal = document.getElementById('update-modal');
      const modalBar = document.getElementById('update-modal-bar');
      const resetButton = (text) => { if (updateButton) { updateButton.textContent = text; updateButton.disabled = false; updateButton.style.opacity = ''; } };
      const openModal = () => {
        if (!modal) return;
        modal.style.display = 'flex';
        modal.style.opacity = '0';
        modal.style.transform = 'scale(0.92)';
        modalBar.style.width = '0%';
        void modal.offsetWidth;
        requestAnimationFrame(() => {
          modal.style.opacity = '1';
          modal.style.transform = 'scale(1)';
        });
      };
      const closeModal = () => {
        if (!modal) return;
        modal.style.opacity = '0';
        modal.style.transform = 'scale(0.92)';
        setTimeout(() => { modal.style.display = 'none'; }, 250);
      };
      if (updateButton) { updateButton.disabled = true; updateButton.style.opacity = '0.6'; }
      try {
        const check = await ipcRenderer.invoke('check-update');
        if (!check || !check.ok) { resetButton('更新'); showToast('检查更新失败', 'error'); return; }
        if (!check.needUpdate) { resetButton('更新'); showToast('已是最新版本', 'success'); return; }
        openModal();
        if (updateProgressHandler) ipcRenderer.removeListener('update-progress', updateProgressHandler);
        updateProgressHandler = (event, p) => {
          const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
          if (modalBar) modalBar.style.width = pct + '%';
        };
        ipcRenderer.on('update-progress', updateProgressHandler);
        const r = await ipcRenderer.invoke('perform-update');
        if (updateProgressHandler) { ipcRenderer.removeListener('update-progress', updateProgressHandler); updateProgressHandler = null; }
        if (r && r.ok && r.needRestart) {
          if (modalBar) modalBar.style.width = '100%';
          setTimeout(() => { closeModal(); showToast('更新完成', 'success'); setTimeout(() => ipcRenderer.send('restart-app'), 500); }, 600);
        } else {
          closeModal();
          resetButton('更新');
        }
      } catch (e) {
        if (updateProgressHandler) { ipcRenderer.removeListener('update-progress', updateProgressHandler); updateProgressHandler = null; }
        closeModal();
        resetButton('更新');
      }
    };

    const checkVersionUpdate = async (showTip = false) => {
      const currentVersion = await ipcRenderer.invoke('get-version');
      const remoteVersion = await ipcRenderer.invoke('get-latest-version');
      try {
        if (remoteVersion && isNewerVersion(remoteVersion, currentVersion)) {
          const updateButton = document.getElementById('toggle-update');
          const versionLabel = document.getElementById('version-label');
          if (updateButton) {
            updateButton.textContent = '更新';
            updateButton.onclick = performUpdate;
          }
          if (versionLabel) {
            versionLabel.innerHTML = `当前版本 [ v${currentVersion} ] <span class="version-update-icon">! <span class="version-tooltip">最新版本: v${remoteVersion}</span></span>`;
            const icon = versionLabel.querySelector('.version-update-icon');
            const tooltip = icon.querySelector('.version-tooltip');
            if (icon && tooltip) {
              icon.addEventListener('mouseenter', () => tooltip.classList.add('show'));
              icon.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
            }
          }
        } else {
          if (showTip) showToast('已是最新', 'success');
          const versionLabel = document.getElementById('version-label');
          if (versionLabel) versionLabel.textContent = `当前版本 [ v${currentVersion} ]`;
        }
      } catch (error) {
        console.error('检查更新失败:', error);
        if (showTip) showToast('检查失败', 'error');
        const versionLabel = document.getElementById('version-label');
        if (versionLabel) versionLabel.textContent = `当前版本 [ v${currentVersion} ]`;
      }
    };

    const isNewerVersion = (newVersion, currentVersion) => {
      try {
        const newParts = newVersion.split('.').map(Number);
        const currentParts = currentVersion.split('.').map(Number);
        const maxLength = Math.max(newParts.length, currentParts.length);
        for (let i = 0; i < maxLength; i++) {
          const newPart = newParts[i] || 0;
          const currentPart = currentParts[i] || 0;
          if (newPart > currentPart) return true;
          if (newPart < currentPart) return false;
        }
        return false;
      } catch (error) {
        console.error('版本比较失败:', error);
        return false;
      }
    };

    document.getElementById('toggle-update')?.addEventListener('click', () => checkVersionUpdate(true));

    let themePreviewTimer = null;
    function setThemePreview(preview, imagePath) {
      if (themePreviewTimer) clearTimeout(themePreviewTimer);
      preview.classList.add('fade-out');
      themePreviewTimer = setTimeout(() => {
        preview.style.backgroundImage = `url('${imagePath}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
        preview.style.backgroundRepeat = 'no-repeat';
        preview.classList.remove('fade-out');
        themePreviewTimer = null;
      }, 180);
    }

    function scrollToCard(inputElement) {
      const card = inputElement.closest('.setting-card');
      const panel = document.querySelector('.settings-panel');
      if (card && panel) {
        const cardLeft = card.offsetLeft;
        const panelWidth = panel.offsetWidth;
        const scrollLeft = cardLeft - (panelWidth / 2) + (card.offsetWidth / 2);
        panel.scrollTo({ left: scrollLeft, behavior: 'smooth' });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      Promise.all([ipcRenderer.invoke('get-version'), ipcRenderer.invoke('get-latest-version')]).then(([currentVersion, latestVersion]) => {
        const versionLabel = document.getElementById('version-label');
        const updateButton = document.getElementById('toggle-update');
        if (versionLabel) {
          if (latestVersion) {
            versionLabel.innerHTML = `当前版本 [ v${currentVersion} ] <span class="version-update-icon">! <span class="version-tooltip">最新版本: v${latestVersion}</span></span>`;
            const icon = versionLabel.querySelector('.version-update-icon');
            const tooltip = icon?.querySelector('.version-tooltip');
            if (icon && tooltip) {
              icon.addEventListener('mouseenter', () => tooltip.classList.add('show'));
              icon.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
            }
            if (updateButton) {
              updateButton.textContent = '更新';
              updateButton.onclick = performUpdate;
            }
          } else {
            versionLabel.textContent = `当前版本 [ v${currentVersion} ]`;
          }
        }
      });

      ipcRenderer.on('version-updated', (event, version) => {
        const versionLabel = document.getElementById('version-label');
        if (versionLabel) versionLabel.textContent = `当前版本 [ v${version} ]`;
      });

      const themeOptions = document.getElementById('theme-options');
      const themePreview = document.getElementById('theme-preview');
      let themeImages = {};
      let themeButtons = [];
      const savedTheme = localStorage.getItem('selectedTheme') || 'Origin';

      async function loadThemes() {
        try {
          const themes = await ipcRenderer.invoke('get-themes');
          if (!themes || themes.length === 0) return;
          themeOptions.innerHTML = '';
          themeImages = {};

          themes.forEach(theme => {
            const imagePath = `../../Theme/${theme.cover}`;
            themeImages[theme.id] = imagePath;

            const button = document.createElement('button');
            button.className = 'theme-button';
            button.dataset.theme = theme.id;
            button.textContent = theme.name;
            button.title = theme.description || theme.name;

            if (theme.id === savedTheme) {
              button.classList.add('active');
            }

            button.addEventListener('click', () => {
              const selectedTheme = button.dataset.theme;
              const imgPath = themeImages[selectedTheme];
              if (imgPath && themePreview) {
                setThemePreview(themePreview, imgPath);
              }
              themeButtons.forEach(btn => btn.classList.remove('active'));
              button.classList.add('active');
              localStorage.setItem('selectedTheme', selectedTheme);
              ipcRenderer.send('switch-theme', selectedTheme);
            });

            themeOptions.appendChild(button);
          });

          themeButtons = document.querySelectorAll('.theme-button');

          if (themePreview && themeImages[savedTheme]) {
            setThemePreview(themePreview, themeImages[savedTheme]);
          }
        } catch (error) {
          console.error('加载主题失败:', error);
        }
      }

      loadThemes();

      const settingsPanel = document.querySelector(".settings-panel");
      const settingCards = document.querySelectorAll(".setting-card");
      let isHoveringCard = false;
      settingsPanel?.addEventListener("wheel", function (event) {
        if (!isHoveringCard) {
          event.preventDefault();
          settingsPanel.scrollLeft += event.deltaY * 2;
        }
      }, { passive: false });
      settingCards.forEach(card => {
        card.addEventListener("mouseover", function () {
          isHoveringCard = true;
          card.classList.add("active");
        });
        card.addEventListener("mouseout", function (event) {
          if (!card.contains(event.relatedTarget)) {
            isHoveringCard = false;
            card.classList.remove("active");
          }
        });
        card.addEventListener("wheel", function (event) {
          event.stopPropagation();
        }, { passive: true });
      });
    });
  </script>
</body>

</html>
